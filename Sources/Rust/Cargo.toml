[workspace]
resolver = "2"
members = [
    "walletkit-ffi",
    "walletkit-hardware",
    "walletkit-trezor",
]

# WalletKit's release version; `make release` sets it.
[workspace.package]
version = "0.8.0"

# Xcode 27 ld emits proc-macro dylibs dyld rejects ("mis-aligned LINKEDIT")
# when stripping at a deployment target below the host's.
[profile.release.build-override]
strip = "none"
