name: CI Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Setup mise
        uses: jdx/mise-action@v2
        env:
          MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install tools
        run: mise install
        env:
          MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests
        run: make test

      # SwiftPM consumers build the committed sources, so they must match.
      - name: Check generated sources are committed
        run: |
          status="$(git status --porcelain -- Sources/Generated)"
          if [ -n "$status" ]; then
            echo "Regenerate and commit Sources/Generated:"
            echo "$status"
            exit 1
          fi

      # Catches broken DocC; docs.yml publishes it.
      - name: Build documentation
        run: make docs
