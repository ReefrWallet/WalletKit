name: WalletKit

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Install macOS build dependencies
        run: |
          brew install grpc-swift libusb pkg-config protobuf swift-protobuf
          protoc --version

      - name: Setup mise
        uses: jdx/mise-action@v2
        env:
          MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install tools
        run: mise install
        env:
          MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests
        run: make test

  documentation:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Install macOS build dependencies
        run: |
          brew install grpc-swift libusb pkg-config protobuf swift-protobuf
          protoc --version

      - name: Setup mise
        uses: jdx/mise-action@v2
        env:
          MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install tools
        run: mise install
        env:
          MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build documentation
        run: make docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          include-hidden-files: true
          path: .build/docs

  deploy-documentation:
    if: github.event_name != 'pull_request'
    needs: documentation
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
