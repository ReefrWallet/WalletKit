<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$pagetitle$</title>
$if(description)$
<meta name="description" content="$description$">
$endif$
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --surface: #f5f5f7;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --border: #d2d2d7;
    --accent: #0066cc;
    --accent-text: #ffffff;
    --notice-bg: #fff8e5;
    --notice-border: #e6b800;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --surface: #1c1c1e;
      --text: #f5f5f7;
      --muted: #a1a1a6;
      --border: #38383a;
      --accent: #2997ff;
      --accent-text: #000000;
      --notice-bg: #2b2412;
      --notice-border: #a68100;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 17px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  main { max-width: 980px; margin: 0 auto; padding: 64px 22px 48px; }
  h1 { font-size: 48px; line-height: 1.1; letter-spacing: -0.02em; margin: 0 0 8px; }
  main > p:first-of-type { font-size: 21px; color: var(--muted); margin: 0 0 32px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code { font: 0.9em ui-monospace, "SF Mono", Menlo, monospace; }
  .notice {
    background: var(--notice-bg);
    border-left: 4px solid var(--notice-border);
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 40px;
    font-size: 15px;
  }
  .notice p { margin: 0; }
  .modules { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
  .module {
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 28px;
  }
  .module h2 { font-size: 28px; margin: 0 0 12px; letter-spacing: -0.01em; }
  .module h2 a { color: var(--text); }
  .module p { margin: 0 0 12px; }
  .module ul { padding-left: 20px; margin: 0 0 20px; color: var(--muted); }
  .module li { margin-bottom: 4px; }
  .module p:last-child { margin: auto 0 0; }
  .button {
    display: inline-block;
    background: var(--accent);
    color: var(--accent-text);
    border-radius: 980px;
    padding: 8px 18px;
    font-size: 15px;
    font-weight: 500;
  }
  .button:hover { text-decoration: none; opacity: 0.9; }
  main > p:last-of-type { margin-top: 40px; color: var(--muted); font-size: 15px; }
  @media (max-width: 600px) {
    main { padding-top: 40px; }
    h1 { font-size: 36px; }
    .module { padding: 22px; }
  }
</style>
</head>
<body>
<main>
<h1>$title$</h1>
$body$
</main>
</body>
</html>
